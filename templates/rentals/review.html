{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4">
            <h3 class="fw-bold mb-4">قيّم تجربتك ⭐</h3>
            <p class="text-muted">الأداة: <strong>{{ rental.item.name }}</strong></p>

            <form method="POST">
                {% csrf_token %}

                <div class="mb-4">
                    <label class="form-label fw-bold">التقييم</label>
                    <div class="d-flex gap-3 fs-3">
                        {% for i in '12345' %}
                        <div class="form-check">
                            <input class="form-check-input" type="radio"
                                   name="rating" value="{{ i }}"
                                   id="star{{ i }}" required>
                            <label class="form-check-label" for="star{{ i }}">
                                {{ i }}⭐
                            </label>
                        </div>
                        {% endfor %}
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">تعليقك (اختياري)</label>
                    <textarea name="comment" class="form-control" rows="3"
                              placeholder="كيف كانت التجربة؟"></textarea>
                </div>

                <button type="submit" class="btn btn-fazaa w-100">إرسال التقييم ⭐</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
