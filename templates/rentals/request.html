{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h3 class="fw-bold mb-4">طلب استعارة — {{ item.name }}</h3>

            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">تاريخ الاستلام</label>
                    <input type="date" name="start_date" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">تاريخ الإرجاع</label>
                    <input type="date" name="end_date" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">رسالة لصاحب الأداة (اختياري)</label>
                    <textarea name="message" class="form-control" rows="3"></textarea>
                </div>
                <button type="submit" class="btn btn-fazaa w-100">إرسال الطلب 📨</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
