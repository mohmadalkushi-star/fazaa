{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4">
            <h3 class="text-center fw-bold mb-4">انضم لفزعة 🤝</h3>

            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                <!-- الصورة الشخصية -->
                <div class="mb-3 text-center">
                    <img id="avatarPreview" src="https://ui-avatars.com/api/?name=User&background=e94560&color=fff&size=100&rounded=true"
                         class="rounded-circle mb-2" width="100" height="100" style="object-fit:cover;">
                    <div>
                        <label for="avatar" class="btn btn-sm btn-outline-secondary">
                            اختر صورة شخصية
                        </label>
                        <input type="file" name="avatar" id="avatar"
                               class="d-none" accept="image/*">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">اسم المستخدم</label>
                    <input type="text" name="username" id="usernameInput" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">كلمة المرور</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">رقم الجوال</label>
                    <input type="text" name="phone" class="form-control" required>
                </div>

                <!-- المدينة -->
                <div class="mb-3">
                    <label class="form-label">المدينة</label>
                    <select name="city" id="citySelect" class="form-select" required>
                        <option value="">اختر مدينتك</option>
                        <option value="الرياض">الرياض</option>
                        <option value="جدة">جدة</option>
                        <option value="مكة المكرمة">مكة المكرمة</option>
                        <option value="المدينة المنورة">المدينة المنورة</option>
                        <option value="الدمام">الدمام</option>
                        <option value="ينبع">ينبع</option>
                        <option value="تبوك">تبوك</option>
                        <option value="أبها">أبها</option>
                        <option value="القصيم">القصيم</option>
                        <option value="حائل">حائل</option>
                    </select>
                </div>

                <!-- الحي -->
                <div class="mb-3">
                    <label class="form-label">الحي</label>
                    <input type="text" name="neighborhood" class="form-control"
                           placeholder="اكتب اسم حيّك" required>
                </div>

                <button type="submit" class="btn btn-fazaa w-100">تسجيل</button>
            </form>

            <p class="text-center mt-3">
                عندك حساب؟ <a href="{% url 'login' %}">سجّل دخول</a>
            </p>
        </div>
    </div>
</div>

<script>
// معاينة الصورة قبل الرفع
document.getElementById('avatar').addEventListener('change', function() {
    const file = this.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = e => document.getElementById('avatarPreview').src = e.target.result;
        reader.readAsDataURL(file);
    }
});

// لو ما اختار صورة، تظهر الأحرف الأولى من اسمه
document.getElementById('usernameInput').addEventListener('input', function() {
    const hasFile = document.getElementById('avatar').files.length > 0;
    if (!hasFile) {
        document.getElementById('avatarPreview').src =
            `https://ui-avatars.com/api/?name=${this.value}&background=e94560&color=fff&size=100&rounded=true`;
    }
});
</script>
{% endblock %}
